spring.application.name=ParkSpot
server.port=8080

# ============================================
# Database Configuration (XAMPP MySQL)
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/parkspot?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA & Hibernate Settings
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# Security & JWT Configuration
# ============================================
parkspot.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
parkspot.jwt.expiration-ms=86400000

# ============================================
# Logging
# ============================================
logging.level.com.example.parkspot=DEBUG
logging.level.org.springframework.security=INFO
